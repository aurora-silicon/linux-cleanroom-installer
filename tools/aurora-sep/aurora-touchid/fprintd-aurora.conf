[Unit]
After=apple-sep.service

[Service]
# apple-sep.service only runs modprobe; /dev/sep-bio appears a few seconds
# later, once the enclave is up. Wait for it (at most 15 s) so fprintd does not
# start, find no device and cache "No devices available" until it idles out.
ExecStartPre=/bin/sh -c 'i=0; while [ ! -e /dev/sep-bio ] && [ $i -lt 150 ]; do sleep 0.1; i=$((i+1)); done; exit 0'
# Allow the misc class rather than the node: a path rule is resolved to a
# device number when the cgroup is set up, before ExecStartPre runs, and is
# dropped if /dev/sep-bio does not exist yet.
DeviceAllow=char-misc rw
