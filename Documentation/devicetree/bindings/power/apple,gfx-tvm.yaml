%YAML 1.2
---
$id: http://devicetree.org/schemas/power/apple,gfx-tvm.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T8132 outer graphics TVM power gate

maintainers:
  - Eryk Wieliczko <eryk@wieliczko.ninja>

description: |
  Single-register outer graphics gate. The PMGR GFX domain is its child;
  the inner AGX PMP vote is a separate firmware-owned control. Only bit 0
  is changed by this provider, preserving the remaining register state.

allOf:
  - $ref: power-domain.yaml#

properties:
  compatible:
    const: apple,t8132-gfx-tvm
  reg:
    maxItems: 1
  "#power-domain-cells":
    const: 0

required:
  - compatible
  - reg
  - "#power-domain-cells"

additionalProperties: false

examples:
  - |
    soc {
        #address-cells = <2>;
        #size-cells = <2>;
        power-controller@380760800 {
            compatible = "apple,t8132-gfx-tvm";
            reg = <0x3 0x80760800 0x0 0x4>;
            #power-domain-cells = <0>;
        };
    };
